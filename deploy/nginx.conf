# smoothapt, behind the VPS host's nginx (which terminates TLS for
# updates.rakuensoftware.com and proxies here).
server {
    listen 80 default_server;
    root /srv/smoothapt;
    autoindex off;

    location = /public-key.asc { }
    location = /smooth-archive-keyring.gpg { }
    location /public/ { }

    # Per-user credentials (smoothapt-user). apt sends them from
    # /etc/apt/auth.conf.d; a revoked or unknown id gets 401.
    location /smoothrouter/ {
        auth_basic "smoothrouter";
        auth_basic_user_file /etc/smoothapt/users/smoothrouter.htpasswd;
    }

    location / { return 404; }
}
