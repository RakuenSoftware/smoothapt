# smoothapt, behind the VPS host's nginx, which terminates TLS for
# updates.rakuensoftware.com, checks client certificates against smoothapt's
# CA and passes the result on in X-Client-* headers (deploy/host-nginx.md).

# Every request with the certificate (user id) it came with, if any.
log_format smoothapt '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'client="$http_x_client_dn" serial=$http_x_client_serial';

server {
    listen 80 default_server;
    root /srv/smoothapt;
    autoindex off;
    access_log /var/log/nginx/smoothapt.log smoothapt;

    # The X-Client-* headers are only trustworthy from the host's nginx
    # (its address on the container bridge).
    allow 10.1.0.240;
    deny all;

    location = /public-key.asc { }
    location = /smooth-archive-keyring.gpg { }
    location /public/ { }

    # Per-user client certificates (smoothapt-user): apt presents the one in
    # the router's image. A missing or unknown certificate gets 401, a
    # revoked one 403. Revocations are files named by serial, checked on every
    # request, so a revoke takes effect at once without a reload.
    location /smoothrouter/ {
        if ($http_x_client_verify != "SUCCESS") { return 401; }
        if (-f /etc/smoothapt/users/smoothrouter.revoked/$http_x_client_serial) { return 403; }
    }

    location / { return 404; }
}
